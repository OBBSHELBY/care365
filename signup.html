<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Care 365</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e0f7fa, #e3f2fd);
      padding: 40px 20px;
    }

    .auth-card {
      background: #fff;
      border-radius: 20px;
      padding: 45px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 40px rgba(0, 119, 182, 0.1);
    }

    .auth-logo {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #0077b6;
      margin-bottom: 8px;
    }

    .auth-logo span {
      color: #00b4d8;
    }

    .auth-card h2 {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .auth-card .subtext {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-bottom: 30px;
    }

    .form-row {
      display: flex;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
      flex: 1;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select {
      padding: 12px 16px;
      border: 1.5px solid #d0ecf8;
      border-radius: 10px;
      font-size: 14px;
      color: #1a1a2e;
      outline: none;
      transition: border 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #0077b6;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #0077b6;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #005f8e;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .auth-footer a {
      color: #0077b6;
      font-weight: 600;
      text-decoration: none;
    }

    .divider {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin: 18px 0;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: #eee;
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">Care<span>365</span></div>
      <h2>Create Your Account</h2>
      <p class="subtext">Start tracking your health in minutes.</p>

      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" placeholder="John" />
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" placeholder="Doe" />
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" placeholder="john@example.com" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Create a strong password" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Age</label>
          <input type="number" placeholder="e.g. 35" min="20" max="60" />
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select>
            <option value="">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Primary Health Goal</label>
        <select>
          <option value="">Select your goal</option>
          <option value="hormones">Balance my hormones</option>
          <option value="sugar">Manage blood sugar</option>
          <option value="cholesterol">Monitor cholesterol</option>
          <option value="weight">Track my weight</option>
          <option value="all">Track everything</option>
        </select>
      </div>

      <button class="submit-btn">Create Account</button>

      <div class="divider">or</div>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
      </div>

    </div>
  </div>
<script>
  document.querySelector('.submit-btn').addEventListener('click', async () => {
    const data = {
      first_name:  document.querySelectorAll('input')[0].value,
      last_name:   document.querySelectorAll('input')[1].value,
      email:       document.querySelectorAll('input')[2].value,
      password:    document.querySelectorAll('input')[3].value,
      age:         document.querySelectorAll('input')[4].value,
      gender:      document.querySelectorAll('select')[0].value,
      health_goal: document.querySelectorAll('select')[1].value
    };

    const response = await fetch('http://127.0.0.1:5000/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (response.ok) {
      alert('Account created! Redirecting to login...');
      window.location.href = 'login.html';
    } else {
      alert('Error: ' + result.error);
    }
  });
</script>
</body>
</html>
